language: python

python:
  - "3.5"

before_install:
  - export DJANGO_SETTINGS_MODULE=config.settings.travis

# comando para instalar dependencias
install: 
  - pip install -r requirements.txt
  - pip install codecov

before_script:
  - psql -c 'create database mscmc;' -U postgres
  - python manage.py makemigrations api --settings=config.settings.travis
  - python manage.py migrate api --settings=config.settings.travis

# comando para rodas os testes
script: 
  - coverage run manage.py test

after_success:
  codecov