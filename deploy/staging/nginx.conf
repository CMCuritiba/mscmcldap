upstream mscmcldap_server {
    server unix:/usr/share/webapps/mscmcldap/var/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;

    server_name mscmc.staging.cmc.pr.gov.br;

    rewrite ^ https://$http_host$request_uri? permanent;

    server_tokens off;

    add_header 'Access-Control-Allow-Origin' '*';
}

server {
    listen 443;

    ssl on;

    server_name mscmc.staging.cmc.pr.gov.br;

    ssl_certificate     /etc/ssl/certs/cmc/staging.cmc.pr.gov.br.req.pem;
    ssl_certificate_key /etc/ssl/private/cmc/staging.cmc.pr.gov.br.key.pem;

    server_tokens off;

    access_log /var/www/html/mscmcldap/logs/nginx-access.log;
    error_log /var/www/html/mscmcldap/logs/nginx-error.log;

    location /static/ {
        alias   /var/www/html/mscmcldap/static/;
    }

    location /media/ {
        alias   /var/www/html/mscmcldap/media/;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_set_header 'Access-Control-Allow-Credentials' true;
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://mscmcldap_server;
            break;
        }
    }
}

[ req ]
default_bits        = 2048
default_keyfile     = server-key.pem
distinguished_name  = subject
req_extensions      = req_ext
x509_extensions     = x509_ext
string_mask         = utf8only

# The Subject DN can be formed using X501 or RFC 4514 (see RFC 4519 for a description).
#   Its sort of a mashup. For example, RFC 4514 does not provide emailAddress.
[ subject ]
countryName         = BR
countryName_default     = US

stateOrProvinceName     = Paraná
stateOrProvinceName_default = NY

localityName            = Curitiba
localityName_default        = New York

organizationName         = Camara Municipal de Curitiba
organizationName_default    = Example, LLC

# Use a friendly name here because its presented to the user. The server's DNS
#   names are placed in Subject Alternate Names. Plus, DNS names here is deprecated
#   by both IETF and CA/Browser Forums. If you place a DNS name here, then you 
#   must include the DNS name in the SAN too (otherwise, Chrome and others that
#   strictly follow the CA/Browser Baseline Requirements will fail).
commonName          = CMC
commonName_default      = Example Company

emailAddress            = zaca@zacalandia.com.br
emailAddress_default        = test@example.com

# Section x509_ext is used when generating a self-signed certificate. I.e., openssl req -x509 ...
[ x509_ext ]

subjectKeyIdentifier        = hash
authorityKeyIdentifier  = keyid,issuer

# You only need digitalSignature below. *If* you don't allow
#   RSA Key transport (i.e., you use ephemeral cipher suites), then
#   omit keyEncipherment because that's key transport.
basicConstraints        = CA:FALSE
keyUsage            = digitalSignature, keyEncipherment
subjectAltName          = @alternate_names
nsComment           = "OpenSSL Generated Certificate"

# RFC 5280, Section 4.2.1.12 makes EKU optional
#   CA/Browser Baseline Requirements, Appendix (B)(3)(G) makes me confused
#   In either case, you probably only need serverAuth.
# extendedKeyUsage  = serverAuth, clientAuth

# Section req_ext is used when generating a certificate signing request. I.e., openssl req ...
[ req_ext ]

subjectKeyIdentifier        = hash

basicConstraints        = CA:FALSE
keyUsage            = digitalSignature, keyEncipherment
subjectAltName          = @alternate_names
nsComment           = "OpenSSL Generated Certificate"

# RFC 5280, Section 4.2.1.12 makes EKU optional
#   CA/Browser Baseline Requirements, Appendix (B)(3)(G) makes me confused
#   In either case, you probably only need serverAuth.
# extendedKeyUsage  = serverAuth, clientAuth

[ alternate_names ]

DNS.1       = staging.cmc.pr.gov.br
#DNS.2       = www.example.com
#DNS.3       = mail.example.com
#DNS.4       = ftp.example.com

# Add these if you need them. But usually you don't want them or
#   need them in production. You may need them for development.
# DNS.5       = localhost
# DNS.6       = localhost.localdomain
# DNS.7       = 127.0.0.1

# IPv6 localhost
# DNS.8     = ::1


openssl req -config staging.cmc.pr.gov.br.conf -new -x509 -sha256 -newkey rsa:2048 -nodes -keyout staging.cmc.pr.gov.br.key.pem -days 10000 -out staging.cmc.pr.gov.br.cert.pem

openssl req -config staging.cmc.pr.gov.br.conf -new -sha256 -newkey rsa:2048 -nodes -keyout staging.cmc.pr.gov.br.key.pem -days 365 -out staging.cmc.pr.gov.br.req.pem

openssl x509 -in staging.cmc.pr.gov.br.cert.pem -text -noout

openssl req -in staging.cmc.pr.gov.br.req.pem -text -noout

openssl req -config staging.cmc.pr.gov.br.conf -new -sha256 -newkey rsa:2048 -nodes -keyout staging.cmc.pr.gov.br.key -x509 -days 3650 -out staging.cmc.pr.gov.br.crt


openssl genrsa -des3 -out myCA.key 2048

openssl req -x509 -new -nodes -key myCA.key -sha256 -days 3650 -out myCA.pem

openssl genrsa -out staging.cmc.pr.gov.br.key 2048

openssl req -new -key staging.cmc.pr.gov.br.key -out staging.cmc.pr.gov.br.csr

openssl x509 -req -in staging.cmc.pr.gov.br.csr -CA myCA.pem -CAkey myCA.key -CAcreateserial -out staging.cmc.pr.gov.br.crt -days 3650 -sha256 -extfile staging.cmc.pr.gov.br.ext

