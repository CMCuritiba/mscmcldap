server {
    listen 8889;
    server_name staging.cmc.pr.gov.br;

    # ssl_certificate     /etc/ssl/certs/cmc/201603-201903/cmc.pr.gov.br.crt;
    # ssl_certificate_key /etc/ssl/private/cmc/201603-201903/cmc.pr.gov.br.key;

    access_log /var/www/html/mscmcldap/logs/nginx-access.log;
    error_log /var/www/html/mscmcldap/logs/nginx-error.log;

    location /static/ {
        alias   /var/www/html/mscmcldap/static/;
    }

    location /media/ {
        alias   /var/www/html/mscmcldap/media/;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://127.0.0.1:8899;
            break;
        }
    }
}
