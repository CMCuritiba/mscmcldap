upstream mscmcldap_server {
    server unix:/app/var/run/gunicorn.sock;
}

server {
    listen 80;

    # server_name mscmc.cmc.pr.gov.br;

    server_tokens off;

    add_header 'Access-Control-Allow-Origin' '*';

    # access_log /var/www/html/mscmcldap/logs/nginx-access.log;
    # error_log /var/www/html/mscmcldap/logs/nginx-error.log;

    location /static/ {
        alias   /var/www/html/mscmcldap/static/;
    }

    location /media/ {
        alias   /var/www/html/mscmcldap/media/;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_set_header 'Access-Control-Allow-Credentials' 'true';
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://mscmcldap_server;
            break;
        }
    }
}
